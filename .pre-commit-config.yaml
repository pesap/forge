minimum_prek_version: "0.4.1"

default_stages:
  - pre-commit

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
          - --markdown-linebreak-ext=markdown

      - id: check-added-large-files
        args: ["--maxkb=1000"]

      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: fix-byte-order-marker

      - id: check-toml
      - id: check-yaml

      - id: mixed-line-ending
        args: ["--fix=lf"]

      - id: check-merge-conflict
      - id: detect-private-key

      - id: check-shebang-scripts-are-executable
      - id: check-vcs-permalinks

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.14.0
    hooks:
      - id: zizmor
        args: [--pedantic]
        always_run: true

  # Taplo moved to a pinned remote hook for consistency with other shared tooling hooks.
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint

  # Project-specific hooks stay local; generic/shared checks should prefer pinned remote repos.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.8.3"]
        types_or: [yaml, json, markdown]

      - id: ci-cargo-fmt
        name: ci cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ci-cargo-clippy
        name: ci cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ci-prek
        name: ci prek
        entry: prek run --all-files
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-cargo-test
        name: ci cargo test
        entry: cargo test
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages: [pre-push]
