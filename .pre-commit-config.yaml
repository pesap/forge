minimum_prek_version: "0.4.1"

default_stages:
  - pre-commit

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
          - --markdown-linebreak-ext=markdown

      - id: check-added-large-files
        args: ["--maxkb=1000"]

      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: fix-byte-order-marker

      - id: check-toml
      - id: check-yaml

      - id: mixed-line-ending
        args: ["--fix=lf"]

      - id: check-merge-conflict
      - id: detect-private-key

      - id: check-shebang-scripts-are-executable
      - id: check-vcs-permalinks

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: local
    hooks:
      - id: taplo-format
        name: taplo format
        entry: uvx --from taplo==0.9.3 taplo fmt
        language: system
        types_or: [toml]

      - id: taplo-lint
        name: taplo lint
        entry: uvx --from taplo==0.9.3 taplo check
        language: system
        types_or: [toml]

      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.8.3"]
        types_or: [yaml, json, markdown]

      - id: commitizen-branch
        name: commitizen check branch
        entry: >-
          bash -c 'range="origin/main..HEAD"; commit_count="$(git rev-list --count "$range")";
          if [ "$commit_count" = "0" ]; then echo "No commits to check in $range"; exit 0; fi;
          uvx --from commitizen==4.16.2 cz check --rev-range "$range"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
