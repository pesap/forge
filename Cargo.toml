[package]
name = "forge"
version = "0.4.0"
edition = "2024"
repository = "https://github.com/pesap/forge"
description = "CLI for scaffolding and updating repository infrastructure from blueprints"
homepage = "https://github.com/pesap/forge"
authors = ["Forge contributors"]

[package.metadata.wix]
upgrade-guid = "B2A381AE-27CC-4061-AADC-3CF4573C2974"
path-guid = "72161012-6163-4293-B537-0AC6DA0F4D52"
license = false
eula = false

[features]
default = ["self-update"]
# Adds self-update functionality for cargo-dist standalone installer builds.
self-update = ["dep:axoupdater", "dep:http", "dep:tokio"]

[dependencies]
anyhow = "1.0.100"
axoupdater = { version = "0.10.0", default-features = false, features = [
  "github_releases",
], optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.5.61"
dialoguer = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
http = { version = "1.1", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
minijinja = { version = "2.12.0", default-features = false, features = [
  "builtins",
  "multi_template",
  "serde",
] }
similar = "3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
tempfile = "3.15.0"
yaml-rust2 = "0.11.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
