name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create release PRs and tags
      pull-requests: write # required to open/update release PRs
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          skip-github-release: true

  dispatch-dist-release:
    name: dispatch dist release
    runs-on: ubuntu-latest
    needs: release-please
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    timeout-minutes: 60
    permissions:
      actions: write # required to dispatch the generated cargo-dist workflow
      contents: read # required to read Cargo.toml and releases
      pull-requests: write # required to update release PR lifecycle labels
      issues: write # required to update labels on pull requests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Dispatch cargo-dist release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_ENV"
          gh workflow run v-release.yml --ref main --field tag="v${version}"
      - name: Wait for cargo-dist release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag is published."
              exit 0
            fi
            echo "Waiting for cargo-dist to publish $tag (${attempt}/60)..."
            sleep 60
          done

          echo "Timed out waiting for cargo-dist to publish $tag" >&2
          exit 1
      - name: Mark release PR as tagged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_number="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/commits/${RELEASE_COMMIT}/pulls" \
            --jq '.[] | select(.merged_at != null and (.title | startswith("chore(main): release "))) | .number' \
            | head -n 1)"

          if [ -z "$pr_number" ]; then
            echo "No merged release PR found for commit ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          gh label create "autorelease: tagged" --color "0e8a16" --description "Release PR has been tagged" --force
          gh pr edit "$pr_number" --remove-label "autorelease: pending" || true
          gh pr edit "$pr_number" --add-label "autorelease: tagged"
